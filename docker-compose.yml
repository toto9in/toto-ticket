services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: toto
      POSTGRES_PASSWORD: toto
      POSTGRES_DB: toto_ticket
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toto -d toto_ticket"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
