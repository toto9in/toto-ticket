name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # dead_code allowed until the domain is wired into main
      - run: cargo clippy --all-targets -- -D warnings -A dead_code
      - run: cargo test
