[package]
name = "toto-ticket-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
